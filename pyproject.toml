[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soulmate-ai"
version = "1.0.0"
description = "Soulmate — A local-first AI reasoning agent with persistent memory, 9-phase reasoning loop, and recursive knowledge graph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "singularitycurse26-svg" }]
keywords = ["ai", "agent", "reasoning", "memory", "local", "ollama", "soulmate", "cascade", "windsurf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "sse-starlette>=1.8.0",
    "langgraph>=0.0.40",
    "langchain-core>=0.1.0",
    "PyYAML>=6.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.3.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.0",
    "click>=8.1.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "httpx[test]>=0.25.0",
]
[project.scripts]
soulmate = "fable_mythos.cli.chat:main"
soulmate-server = "fable_mythos.main:run_server"
soulmate-cascade-install = "fable_mythos.integration.cascade_installer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fable_mythos"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["src/fable_mythos"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
